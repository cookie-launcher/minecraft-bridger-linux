name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Bridger.Android/**'
      - 'Bridger.Core/**'
      - 'tools/jre-hazirla.sh'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android iş yükünü kur
        run: dotnet workload install android

      - name: Gömülü JRE varlıklarını hazırla (Pojav APK'sından)
        run: |
          curl -L --fail -o /tmp/PojavLauncher.apk \
            https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk
          ./tools/jre-hazirla.sh /tmp/PojavLauncher.apk

      - name: Sunucu varlıklarını hazırla (gömülü Paper + eula + server.properties)
        run: |
          mkdir -p Bridger.Android/Assets/spike
          printf 'eula=true\n' > Bridger.Android/Assets/spike/eula.txt
          printf 'online-mode=false\nmotd=Android JVM Testi\nserver-port=25565\nlevel-name=dunya\nlevel-type=flat\nspawn-protection=0\nmax-players=3\nview-distance=4\nsimulation-distance=4\n' \
            > Bridger.Android/Assets/spike/server.properties
          PAPER_URL=$(python3 -c 'import json,urllib.request; req=urllib.request.Request("https://fill.papermc.io/v3/projects/paper/versions/1.21.8/builds/latest", headers={"User-Agent":"MinecraftBridger-CI/0.1"}); print(json.load(urllib.request.urlopen(req))["downloads"]["server:default"]["url"])')
          curl -L --fail -H "User-Agent: MinecraftBridger-CI/0.1" \
            -o Bridger.Android/Assets/spike/paper.jar "$PAPER_URL"
          [ "$(stat -c%s Bridger.Android/Assets/spike/paper.jar)" -gt 30000000 ]
          ls -la Bridger.Android/Assets/spike/

      - name: APK derle (Release, tüm mimariler)
        run: |
          dotnet publish Bridger.Android/Bridger.Android.csproj -c Release \
            -p:AndroidPackageFormats=apk \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:JavaSdkDirectory="$JAVA_HOME"

      - name: APK'yı artefakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: bridger-android
          path: Bridger.Android/bin/Release/**/*.apk
          if-no-files-found: error

      - name: Etiketli sürümdeyse GitHub Release'e ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Bridger.Android/bin/Release/**/*.apk
